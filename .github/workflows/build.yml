name: Build MiroGram APK + GoFile Upload

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.2.12479018'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK (this may take 60-120 minutes)
        run: ./gradlew assembleAfatDebug --no-daemon
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.jdk }}
        timeout-minutes: 150

      - name: Find built APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "*-debug.apk" -o -name "*afatDebug*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find TMessagesProj_App/build/outputs -name "*.apk" | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH" || echo "APK not found"

      - name: Upload APK to GoFile
        if: steps.find-apk.outputs.apk_path != ''
        id: upload-gofile
        run: |
          APK="${{ steps.find-apk.outputs.apk_path }}"
          echo "Uploading $APK to GoFile..."
          RESPONSE=$(curl -s -F "file=@$APK" https://store1.gofile.io/contents/uploadfile)
          echo "$RESPONSE"
          
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | grep -o '"downloadPage":"[^"]*"' | cut -d'"' -f4 || echo "")
          echo "download_page=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiroGram-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 7

      - name: Summary
        run: |
          echo "## ✅ MiroGram Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download Link (GoFile):** ${{ steps.upload-gofile.outputs.download_page }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package: com.mirogram.android" >> $GITHUB_STEP_SUMMARY